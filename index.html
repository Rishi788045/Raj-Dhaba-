<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0d0a">
<title>राज ढाबा – QR ऑर्डर</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Tiro+Devanagari+Hindi:ital@0;1&family=Noto+Serif+Devanagari:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#121212;--gold:#C6A15B;--ivory:#FAF7F0;--charcoal:#252525;--gray:#77736B;
  --green:#26734D;--warn:#B7791F;--err:#B42318;--line:#E7E2D8;--card:#FFFFFF;
  --dcard:#1E1E1E;--dline:#2F2F2F;--dtext:#F5F5F5;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Inter,'Noto Sans Devanagari',system-ui,sans-serif;font-size:16px;line-height:1.5;background:var(--ivory);color:var(--charcoal);-webkit-text-size-adjust:100%}
body.staff{background:var(--black);color:var(--dtext)}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:'Playfair Display','Noto Sans Devanagari',serif;font-weight:700;line-height:1.25}
small{font-size:14px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* ---------- buttons (design standard) ---------- */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:52px;padding:10px 18px;border-radius:var(--r);border:1.5px solid transparent;font-weight:600;font-size:18px;line-height:1.25;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn small{font-weight:500;opacity:.8;font-size:14px}
.btn-primary{background:var(--gold);color:var(--black)}
.btn-secondary{background:#fff;color:var(--charcoal);border-color:var(--gold)}
.btn-success{background:var(--green);color:#fff}
.btn-warning{background:var(--warn);color:#fff}
.btn-error{background:var(--err);color:#fff}
.btn-lg{min-height:62px;font-size:19px}
.btn-md{min-height:50px}
.btn[disabled],.btn.disabled{background:var(--line);color:var(--gray);border-color:transparent;cursor:not-allowed}
.btn-ghost-dark{background:transparent;color:var(--dtext);border-color:#444}
.btn-inline{width:auto;display:inline-flex}

/* ---------- customer header ---------- */
.top{background:var(--black);color:#fff;border-bottom:2px solid var(--gold)}
.top .wrap{padding-top:14px;padding-bottom:14px;display:flex;align-items:center;gap:10px}
.top h1{font-size:22px;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid #444;background:transparent;color:#fff;font-size:22px;flex:0 0 auto}
.tpill{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.lang{display:flex;border:1px solid #444;border-radius:999px;overflow:hidden;flex:0 0 auto}
.lang button{background:transparent;border:0;color:#cfcfcf;padding:8px 12px;font-size:14px;min-height:36px}
.lang button.on{background:var(--gold);color:var(--black);font-weight:700}
.hero{background:radial-gradient(120% 90% at 50% 0%,#2a2418 0%,var(--black) 60%);color:#fff;text-align:center;padding:30px 20px 34px;border-bottom:2px solid var(--gold)}
.logo{width:72px;height:72px;margin:0 auto 14px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:'Playfair Display','Noto Sans Devanagari',serif;font-weight:700;font-size:32px;color:var(--gold);background:#161616}
.hero h1{font-size:36px;color:#fff;letter-spacing:.5px}
.hero .tag{color:var(--gold);font-size:16px;margin-top:2px;letter-spacing:1px}
.divider{width:64px;height:2px;background:var(--gold);margin:16px auto}
.hero .tpill{display:inline-block;font-size:18px;padding:8px 18px}
.hero .row{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.home-actions{padding:28px 20px;display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto}
.foot{text-align:center;color:var(--gray);font-size:14px;padding:12px 20px 40px}
.foot a{color:var(--charcoal);font-weight:600;text-decoration:none}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 0}
.steps3 div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center;font-size:14px;color:var(--gray)}
.steps3 b{display:block;color:var(--charcoal);font-size:16px}

/* ---------- menu ---------- */
.catnav{position:sticky;top:0;z-index:20;background:var(--ivory);border-bottom:1px solid var(--line)}
.catnav .scroll{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none;max-width:720px;margin:0 auto}
.catnav .scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:15px;min-height:42px;color:var(--charcoal)}
.chip.on{background:var(--black);color:var(--gold);border-color:var(--black);font-weight:600}
.vegtoggle{display:flex;align-items:center;gap:10px;padding:14px 0 0;font-size:15px;color:var(--charcoal)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;border:0;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--green)}
.sw.on::after{left:23px}
.sec{padding-top:28px;scroll-margin-top:70px}
.sec h2{font-size:24px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec h2::after{content:'';flex:1;height:1px;background:var(--gold);opacity:.6}
.food{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.food.off{opacity:.55}
.food-top{display:flex;gap:14px}
.thumb{flex:0 0 88px;width:88px;height:88px;border-radius:12px;background:linear-gradient(135deg,#1b1b1b,#2e2818);border:1px solid var(--gold);display:grid;place-items:center;font-size:38px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.nm{font-size:18px;font-weight:600;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
.nm .vd{margin-top:5px}
.ds{font-size:14px;color:var(--gray);margin-top:4px}
.vd{width:16px;height:16px;border:2px solid currentColor;border-radius:3px;display:inline-grid;place-items:center;flex:0 0 auto}
.vd::after{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.vd.v{color:var(--green)}.vd.e{color:var(--warn)}.vd.n{color:var(--err)}
.seg{display:flex;gap:8px;margin-top:14px}
.seg button{flex:1;min-height:50px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--charcoal);font-size:16px;line-height:1.25}
.seg button b{display:block;font-size:17px}
.seg button.on{border:2px solid var(--gold);background:#FBF5E8}
.single{margin-top:14px;font-size:17px;display:flex;align-items:baseline;gap:8px}
.single b{font-size:18px}
.single small{color:var(--gray)}
.food-act{display:flex;gap:12px;margin-top:14px;align-items:center}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;flex:0 0 auto}
.step button{width:46px;height:48px;border:0;background:#fff;font-size:24px;line-height:1}
.step span{min-width:36px;text-align:center;font-weight:700;font-size:18px}
.food-act .btn{flex:1;min-height:48px;font-size:17px}
.incart{margin-top:10px;font-size:14px;color:var(--green);font-weight:600}
.offtag{margin-top:12px;font-size:14px;color:var(--gray);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(18,18,18,.97),rgba(18,18,18,.9));border-top:1px solid var(--gold)}
.bar .btn{max-width:688px;margin:0 auto;min-height:58px;flex-direction:row;justify-content:space-between;font-size:18px}
.spacer{height:110px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--black);color:#fff;border:1px solid var(--gold);padding:10px 18px;border-radius:999px;font-size:15px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* ---------- cart / bill ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
.line{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .li{flex:1;min-width:0}
.line .li b{font-size:17px;display:block;line-height:1.3}
.line .li small{color:var(--gray)}
.line .lt{font-weight:700;font-size:17px;min-width:64px;text-align:right}
.trow{display:flex;justify-content:space-between;padding:6px 0;font-size:16px}
.trow.big{font-size:22px;font-weight:700;border-top:1px dashed var(--gold);margin-top:8px;padding-top:14px}
textarea.note{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;resize:vertical}
label.lb{display:block;font-weight:600;margin:16px 0 8px}
.empty{text-align:center;padding:48px 20px;color:var(--gray)}
.empty .big{font-size:48px}

/* ---------- success / tracking ---------- */
.okwrap{text-align:center;padding:36px 20px 20px}
.tick{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:44px;margin:0 auto 18px}
.okwrap h1{font-size:26px;color:var(--charcoal)}
.okwrap p{color:var(--gray);margin-top:8px}
.ocard{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--r);padding:20px;margin:22px auto 0;text-align:center}
.ocard .lab{font-size:13px;letter-spacing:1.5px;color:var(--gray);font-weight:600}
.ocard .num{font-size:30px;font-weight:700;font-family:'Playfair Display',serif;margin:2px 0 10px}
.ocard .tb{font-size:20px;font-weight:600}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;background:#EFE7D3;color:var(--charcoal);margin-top:12px}
.badge.READY,.badge.SERVED{background:var(--green);color:#fff}
.badge.PREPARING{background:var(--warn);color:#fff}
.badge.NEW{background:var(--gold);color:var(--black)}
.badge.ACCEPTED{background:#DAD4C4}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.timeline{margin-top:8px}
.tl{display:flex;gap:16px;position:relative;padding-bottom:22px}
.tl:last-child{padding-bottom:0}
.tl::before{content:'';position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl.done::before{background:var(--green)}
.dot{flex:0 0 40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-weight:700;color:var(--gray)}
.tl.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.tl.cur .dot{border-color:var(--gold);background:var(--black);color:var(--gold);box-shadow:0 0 0 5px rgba(198,161,91,.25)}
.tl.cur.ready .dot{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 0 0 5px rgba(38,115,77,.2)}
.tl .tx b{font-size:18px;display:block;line-height:1.3;padding-top:7px}
.tl .tx small{color:var(--gray)}
.tl.pend .tx b{color:var(--gray);font-weight:500}
.ord{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.ord .oh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ord .oh b{font-size:20px;font-family:'Playfair Display',serif}
.ord .sm{color:var(--gray);font-size:14px;margin-top:6px}
.ord .ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:18px;font-weight:700}
.ord .btn{margin-top:12px;min-height:48px;font-size:16px}
.ord ul{list-style:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.ord li{display:flex;justify-content:space-between;font-size:15px;padding:3px 0}
.notice{background:#FBF5E8;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:16px;color:var(--charcoal)}
.notice.priv{background:#fff}

/* ---------- staff ---------- */
.gate{max-width:380px;margin:12vh auto 0;padding:24px;background:var(--dcard);border:1px solid var(--dline);border-top:3px solid var(--gold);border-radius:var(--r);text-align:center}
.gate h1{color:var(--gold);font-size:26px;margin-bottom:6px}
.gate p{color:#aaa;font-size:14px;margin-bottom:16px}
.gate input{width:100%;height:54px;text-align:center;font-size:22px;letter-spacing:6px;background:#121212;border:1px solid #444;border-radius:12px;margin-bottom:14px}
.errtxt{color:#ff8a80;font-size:14px;margin-bottom:10px}
.shead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--gold);background:var(--black);position:sticky;top:0;z-index:25;flex-wrap:wrap}
.shead h1{font-size:20px;color:var(--gold);flex:1;min-width:140px}
.shead .lang button{color:#ccc}
.smallbtn{border:1px solid #444;background:transparent;color:var(--dtext);border-radius:10px;padding:8px 12px;min-height:40px;font-size:14px}
.smallbtn.on{border-color:var(--gold);color:var(--gold)}
.demo{background:#2a2418;border-bottom:1px solid var(--gold);color:#e8d9b6;font-size:13px;padding:8px 16px;text-align:center}
.kwrap{padding:16px;max-width:960px;margin:0 auto}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid #444;background:transparent;color:var(--dtext);border-radius:999px;padding:9px 16px;min-height:44px;font-size:15px}
.tab.on{background:var(--gold);color:var(--black);border-color:var(--gold);font-weight:700}
.tab i{font-style:normal;margin-left:6px;opacity:.9}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:14px}
.kc{background:var(--dcard);border:1px solid var(--dline);border-left:5px solid var(--gold);border-radius:var(--r);padding:16px}
.kc.ACCEPTED{border-left-color:#8a8a8a}.kc.PREPARING{border-left-color:var(--warn)}.kc.READY{border-left-color:var(--green)}.kc.SERVED{border-left-color:#444;opacity:.8}
.kc .kh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kc .kn{font-size:24px;font-weight:700;font-family:'Playfair Display',serif;color:var(--gold)}
.kc .kt{font-size:22px;font-weight:700}
.kc .km{color:#aaa;font-size:14px;margin:4px 0 10px}
.kc ul{list-style:none;border-top:1px dashed #444;padding-top:8px;margin-bottom:12px}
.kc li{display:flex;gap:10px;padding:4px 0;font-size:17px}
.kc li b{color:var(--gold);min-width:34px}
.kc .kn2{background:#121212;border:1px solid #444;border-radius:10px;padding:8px 10px;font-size:14px;color:#ddd;margin-bottom:12px}
.kc .btn{min-height:52px;font-size:17px}
.alertbar{position:fixed;top:0;left:0;right:0;z-index:80;background:var(--gold);color:var(--black);padding:16px;text-align:center;font-weight:700;font-size:18px;animation:flash 1s ease-in-out 6;box-shadow:0 6px 24px rgba(0,0,0,.5)}
@keyframes flash{50%{background:#e6c98a}}
.adm{display:block}
.side{background:#0c0c0c;border-bottom:1px solid var(--gold);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.side .brandt{display:none}
.side a{flex:0 0 auto;color:#d6d6d6;text-decoration:none;padding:10px 14px;border-radius:10px;font-size:15px;border:1px solid transparent;white-space:nowrap}
.side a.on{background:#1E1E1E;color:var(--gold);border-color:var(--gold);font-weight:600}
.amain{padding:16px;max-width:1100px;margin:0 auto}
.amain h2{font-size:24px;margin-bottom:14px;color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--dcard);border:1px solid var(--dline);border-radius:var(--r);padding:16px}
.stat small{color:#aaa;display:block}
.stat b{font-size:28px;color:var(--gold);font-family:'Playfair Display',serif}
.dcard{background:var(--dcard);border:1px solid var(--dline);border-radius:var(--r);padding:16px;margin-top:14px}
.dcard h3{font-size:18px;margin-bottom:10px;color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;color:#aaa;font-weight:500;padding:8px 6px;border-bottom:1px solid #333;font-size:14px}
table.t td{padding:10px 6px;border-bottom:1px solid #2a2a2a;vertical-align:middle}
.tscroll{overflow-x:auto}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#333;color:#fff}
.pill.NEW{background:var(--gold);color:#121212}.pill.PREPARING{background:var(--warn)}.pill.READY,.pill.SERVED,.pill.paid{background:var(--green)}.pill.unpaid{background:#444}
.mrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #2a2a2a;flex-wrap:wrap}
.mrow .mn{flex:1;min-width:150px}
.mrow .mn b{display:block;font-size:16px}.mrow .mn small{color:#aaa}
.mrow label{font-size:13px;color:#aaa;display:flex;flex-direction:column;gap:2px}
.mrow input[type=number]{width:84px;height:42px;background:#121212;border:1px solid #444;border-radius:10px;padding:0 10px;color:#fff}
.mrow .sw{background:#444}.mrow .sw.on{background:var(--green)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tcard{background:#fff;color:#121212;border-radius:var(--r);padding:16px;text-align:center}
.tcard h3{font-size:20px;margin-bottom:2px}
.tcard small{color:#555;display:block;margin-bottom:10px}
.qr{display:grid;place-items:center;min-height:150px}
.tcard .lk{font-size:11px;color:#777;word-break:break-all;margin-top:8px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row2 .btn{width:auto;flex:1;min-width:150px;min-height:48px;font-size:16px}
@media(min-width:900px){
  .adm{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 62px)}
  .side{flex-direction:column;border-bottom:0;border-right:1px solid var(--dline);padding:16px 12px;overflow:visible}
  .side .brandt{display:block;color:var(--gold);font-family:'Playfair Display','Noto Sans Devanagari',serif;font-size:20px;padding:6px 10px 14px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .foodgrid .food{margin-bottom:0}
}
@media print{
  body,body.staff{background:#fff!important}
  .shead,.side,.demo,.noprint,.toast{display:none!important}
  .adm{display:block}.amain{padding:0}.amain h2{color:#000}
  .tcard{border:1px solid #999;break-inside:avoid}
}
</style>

<style>
.logoimg{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 12px;border-radius:18px;box-shadow:0 0 28px rgba(198,161,91,.35)}
.alertbar{background:linear-gradient(135deg,#8a6d2f,#e6c77a 45%,#8a6d2f)!important;color:#1a1305!important;font-weight:700;letter-spacing:.4px;border:1px solid #fff3c9;box-shadow:0 8px 30px rgba(198,161,91,.55);animation:glow 1.2s ease-in-out 6}
@keyframes glow{50%{box-shadow:0 0 44px 8px rgba(230,199,122,.8)}}
.upimask{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:90;display:grid;place-items:center;padding:18px;backdrop-filter:blur(4px)}
.upibox{background:#fff;border-top:4px solid var(--gold);border-radius:22px;padding:24px 20px;text-align:center;width:100%;max-width:380px}
.upiamt{font-size:42px;font-weight:800;color:var(--black);margin:6px 0 2px}.upisub{color:var(--gray);font-size:14px;margin:6px 0}
.upibtn{display:block;margin-top:14px;padding:20px;border-radius:16px;background:linear-gradient(135deg,#b8923f,#e6c77a);color:#121212;font-size:22px;font-weight:800;text-decoration:none;box-shadow:0 6px 20px rgba(198,161,91,.5)}
.upix{display:block;margin:14px auto 0;background:none;border:0;color:var(--gray);font-size:15px;text-decoration:underline}
.pill.CANCELLED,.badge.CANCELLED{background:#5a2222;color:#ffb4b4}

  const items=cart.map(c=>{const it=itemOf(c.id);return{id:c.id,hi:it.hi,en:it.en,pt:c.pt,price:priceOf(it,c.pt),qty:c.qty}});

    case 'wnext':WQ++;if(WQ>=CUS.length){WQ=-1;toast('✓ सबको भेज दिया')}render();break;
    case 'wstop':WQ=-1;render();break;
    case 'copynums':copyTxt(CUS.map(c=>'91'+c.mobile).join('\n')).then(ok=>toast(ok?'✓ '+CUS.length+' नंबर कॉपी हुए':'कॉपी नहीं हुआ'));break;
    case 'csv':{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',csv=['name,mobile,visits,stamps,last_visit'].concat(CUS.map(c=>[q(c.name),q(c.mobile),c.visits||0,c.stamps||0,q(c.last_visit?new Date(c.last_visit).toISOString().slice(0,10):'')].join(','))).join('\n');
      const bl=new Blob(['\ufeff'+csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='raj-dhaba-customers.csv';document.body.appendChild(a);a.click();a.remove();break}
    case 'cleannow':autoClean(true);break;
    case 'backup':loadHistory(true).then(()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=getOrders().slice().sort((a,b)=>a.created-b.created).map(o=>[new Date(o.created).toISOString().slice(0,10),clock(o.created),o.id,o.table,q(o.name),q(o.mobile),q(o.items.map(i=>i.qty+'x '+(i.hi||i.en)).join('; ')),o.sub,o.disc||0,o.tax,o.total,o.pay==='upi'?'UPI':'Cash',o.status,o.paid?'Paid':'Unpaid'].join(','));
      downloadText('raj-dhaba-orders-'+new Date().toISOString().slice(0,10)+'.csv','date,time,order,table,name,mobile,items,subtotal,discount,tax,total,payment,status,paid\n'+rows.join('\n'));toast('📥 '+rows.length+' ऑर्डर का बैकअप')});break;
    case 'psum':loadHistory(true).then(()=>{const m={};getOrders().filter(o=>o.status!=='CANCELLED').forEach(o=>{const k=new Date(o.created).toLocaleDateString('en-IN'),x=m[k]=m[k]||{n:0,t:0,c:0,u:0,ts:o.created};x.n++;x.t+=o.total;if(o.pay==='upi')x.u+=o.total;else x.c+=o.total;x.ts=Math.min(x.ts,o.created)});
      const ks=Object.keys(m).sort((a,b)=>m[b].ts-m[a].ts);let T=0,N=0;ks.forEach(k=>{T+=m[k].t;N+=m[k].n});
      doPrint(`<div class="bl"><img src="${LOGO}" alt=""><h2>राज ढाबा – बिक्री रिपोर्ट</h2><div class="bm">${new Date().toLocaleString('en-IN')}</div><hr><table>${ks.map(k=>`<tr><td>${k}<br><small>${m[k].n} ऑर्डर · Cash ${rs(m[k].c)} · UPI ${rs(m[k].u)}</small></td><td style="text-align:right">${rs(m[k].t)}</td></tr>`).join('')}</table><hr><div class="br big"><span>कुल (${N})</span><span>${rs(T)}</span></div></div>`)});break;
    case 'purge':{const d=Number(document.getElementById('pd').value);if(!confirm('क्या आपने बैकअप (CSV) डाउनलोड कर लिया? '+(d===1?'आज को छोड़कर सारे':d+' दिन से पुराने')+' ऑर्डर हमेशा के लिए हट जाएँगे।'))break;
      const cut=d===1?startOfDay():Date.now()-d*86400000;sb.from('orders').delete().lt('created',cut).select('id').then(r=>{if(r.error){toast('⚠ '+r.error.message);return}toast('🧹 '+(r.data||[]).length+' ऑर्डर हटाए');ORD=ORD.filter(o=>o.created>=cut);LSIG='';USAT=0;render()});break}
    case 'welcome':openGate();break;
    case 'readyclose':readyPop=null;render();break;
    case 'callw':svcOpen=true;render();break;
    case 'svcclose':svcOpen=false;render();break;
    case 'svc':{const k=b.dataset.k;if(!SV[k])break;if(Date.now()-(lastSvc[k]||0)<20000){toast(lang==='hi'?'सूचना जा चुकी है, कृपया प्रतीक्षा करें':'Already notified, please wait');break}
      if(!sb){toast('Supabase?');break}lastSvc[k]=Date.now();svcOpen=false;render();
      sb.from('calls').insert({tbl:TABLE,created:Date.now(),kind:k}).then(r=>{if(r.error){lastSvc[k]=0;toast('⚠ '+r.error.message)}else toast(SV[k][0]+' '+(lang==='hi'?'सूचना भेज दी गई':'Request sent'))});break}
    case 'nchip':{const v=b.dataset.v;if(!noteText.includes(v))noteText=(noteText?noteText+', ':'')+v;render();break}
    case 'calldone':{const cid=Number(id);CALLS=CALLS.filter(c=>c.id!==cid);if(sb)sb.from('calls').update({done:true}).eq('id',cid).then(r=>{if(r.error)toast('⚠ '+r.error.message)});render();break}
    case 'addw':{const g=x=>document.getElementById(x).value.trim(),ph=g('wm').replace(/\D/g,'').slice(-10);if(!g('wn')||ph.length!==10){toast('नाम और 10 अंकों का मोबाइल डालें');break}
      sb.from('waiters').upsert({phone:ph,name:g('wn'),role:g('wr'),created:Date.now()}).then(r=>{if(r.error)toast('⚠ '+r.error.message);else{toast('✓ रजिस्टर हो गया');pull(true).then(render)}});break}
    case 'delw':if(confirm('हटाएँ?'))sb.from('waiters').delete().eq('phone',id).then(()=>pull(true).then(render));break;
    case 'wlogin':{const v=document.getElementById('wph').value.replace(/\D/g,'').slice(-10),e=document.getElementById('werr');if(v.length!==10){e.textContent='10 अंकों का नंबर डालें';break}
      sb.rpc('waiter_feed',{p:v}).then(r=>{if(!r.data){e.textContent=lang==='hi'?'यह नंबर रजिस्टर नहीं है – काउंटर से रजिस्टर करवाएँ':'Number not registered';return}WPH=v;save('rd_wph',v);WF=r.data;WSEEN=null;try{if(navigator.wakeLock)navigator.wakeLock.request('screen')}catch(x){}render()});break}
    case 'wout':WPH='';save('rd_wph','');WF=null;WSEEN=null;render();break;
    case 'wtest':callRing();break;
    case 'wdone':sb.rpc('waiter_done',{p:WPH,cid:Number(id)}).then(()=>wpull());break;
    case 'login':doLogin();break;
    case 'forgot':doForgot();break;
    case 'setpw':doSetPw();break;
    case 'logout':if(sb)sb.auth.signOut();SESSION=null;ORD=[];LSIG='';render();pull().then(render);break;
    case 'sound':soundOn=!soundOn;if(soundOn)beep();render();break;
    case 'ktab':ktab=b.dataset.s;render();break;
    case 'addItem':{const g=x=>document.getElementById(x).value.trim();const n=g('nn'),h=parseInt(g('nh'),10),f=parseInt(g('nf'),10);
      if(!n||isNaN(f)){toast('नाम और दाम डालें');break}
      const m=menuOv();m.__custom=(m.__custom||[]);const one=isNaN(h);
      const it={id:'c'+Date.now().toString(36),cat:g('nc'),v:g('nv'),hi:n,en:n,dh:'',de:''};if(one){it.p=f;it.unit='each'}else{it.h=h;it.f=f}
      m.__custom.push(it);saveMenu(m);toast('✓ जुड़ गया');render();break}
    case 'delItem':if(confirm('यह आइटम हटाएँ?')){const m=menuOv();m.__custom=(m.__custom||[]).filter(x=>x.id!==id);saveMenu(m);render()}break;
    case 'cancel':if(confirm('ऑर्डर '+id+' रद्द करें? / Cancel this order?')){setStatus(id,'CANCELLED');render()}break;
    case 'paid1':setPaid([id]);render();break;
    case 'bill':printBill(b.dataset.ids.split(','));break;
    case 'paym':payMode=b.dataset.m;render();break;
    case 'upiclose':upiPop=false;render();break;
    case 'upicopy':copyTxt(CFG.upi).then(ok=>{toast(ok?(lang==='hi'?'✓ UPI ID कॉपी हो गई':'✓ UPI ID copied'):CFG.upi);if(ok){const l=b.querySelector('.cpl');if(l)l.textContent=lang==='hi'?'✓ कॉपी हो गई – अब ऐप खोलें':'✓ Copied – now open your app'}});break;
    case 'upiapp':{const u=b.dataset.u;copyTxt(CFG.upi).finally(()=>{location.href=u});break}
    case 'upiopen':upiPop=true;location.hash='#/success/'+id;render();break;
    case 'adv':{const o=getOrder(id);if(o&&o.status!=='CANCELLED'){const n=STATUSES[STATUSES.indexOf(o.status)+1];if(n){setStatus(id,n);if((location.hash||'').startsWith('#/kitchen'))ktab=n==='SERVED'?ktab:n;render()}}break}
    case 'afil':afilter=b.dataset.s;render();break;
    case 'rscope':rscope=b.dataset.s;render();break;
    case 'mtoggle':{const m=menuOv();m[id]=m[id]||{};m[id].off=!m[id].off;saveMenu(m);render();break}
    case 'settle':{CTX.pay=b.dataset.pay||'cash';const n=+b.dataset.t;setPaid(getOrders().filter(o=>o.table===n&&!o.paid).map(o=>o.id));render();break}
    case 'demoadd':demoOrder();render();break;
    case 'demoreset':if(confirm(t('confirmReset'))){if(sb)sb.from('orders').delete().neq('id','').then(()=>pull().then(render));ORD=[];SNAP={};['rd_orders','rd_my','rd_next','rd_cart'].forEach(k=>{delete mem[k];try{localStorage.removeItem(k)}catch(x){}});cart=[];seen=null;render()}break;
    case 'printqr':window.print();break;
  }
});
document.addEventListener('change',e=>{
  const i=e.target;
  if(i.dataset&&i.dataset.act==='mprice'){const v=parseInt(i.value,10);const m=menuOv();m[i.dataset.id]=m[i.dataset.id]||{};if(isNaN(v)||v<0){delete m[i.dataset.id][i.dataset.pt]}else m[i.dataset.id][i.dataset.pt]=v;saveMenu(m);toast('✓')}
});
document.addEventListener('input',e=>{if(e.target.id==='note')noteText=e.target.value;if(e.target.id==='cname')custName=e.target.value;if(e.target.id==='offt')OFFT=e.target.value;if(e.target.id==='cmob')custMob=e.target.value.replace(/\D/g,'').slice(0,10)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw'){const b=document.querySelector('[data-act="login"]');if(b)b.click()}});
document.addEventListener('touchend',()=>{unlockAudio()},{once:true,passive:true});
setInterval(()=>{if(WPH&&(location.hash||'').startsWith('#/waiter'))wpull()},3000);
if(sb)sb.auth.onAuthStateChange((ev,se)=>{if(ev==='SIGNED_OUT')SESSION=null;else if(se)SESSION=se;if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;location.hash='#/admin/dash'}render()});
if(sb)sb.auth.getSession().then(r=>{SESSION=r.data.session;return pull()}).then(render);
render();
</script>
</body>
</html>
